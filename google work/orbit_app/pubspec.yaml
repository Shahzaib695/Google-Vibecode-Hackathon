name: orbit_app
description: "Orbit — Your city, intelligently served. AI Service Orchestrator for Pakistan's informal economy."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # Navigation
  go_router: ^13.2.1

  # UI & Animations
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  lottie: ^3.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  smooth_page_indicator: ^1.1.0
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3

  # Maps
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  http: ^1.2.1
  dio: ^5.4.3+1
  uuid: ^4.3.3
  equatable: ^2.0.5
  dartz: ^0.10.1
  image_picker: ^1.0.7
  url_launcher: ^6.2.6
  flutter_local_notifications: ^17.1.2
  fl_chart: ^0.67.0
  timeline_tile: ^2.0.0
  pin_code_fields: ^8.0.1
  country_code_picker: ^3.0.0
  timeago: ^3.6.1
  flutter_staggered_animations: ^1.1.1
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
