</button>
<div class="font-display-lg-mobile text-display-lg-mobile font-bold tracking-tighter text-primary">
            Orbit
        </div>
<button class="flex items-center justify-center p-1 hover:opacity-80 transition-opacity">
<div class="w-8 h-8 rounded-full bg-surface-container-high border border-outline-variant overflow-hidden flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
</button>

<!-- Header & Progress Section -->
<section class="w-full flex flex-col items-center mb-8">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface text-center mb-6">
                Matching you with experts
            </h1>
<!-- Simulated Progress Indicator -->
<div class="flex items-center justify-center gap-3 w-full px-4">
<div class="flex flex-col items-center gap-2 flex-1">
<div class="h-1.5 w-full bg-primary-container rounded-full"></div>
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase text-[10px]">Scanning</span>
</div>
<div class="flex flex-col items-center gap-2 flex-1">
<div class="h-1.5 w-full bg-primary-container rounded-full"></div>
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase text-[10px]">Filtering</span>
</div>
<div class="flex flex-col items-center gap-2 flex-1 relative">
<!-- Active Pulsing Effect simulated with visual cues -->
<div class="h-1.5 w-full bg-primary rounded-full relative overflow-hidden">
<div class="absolute inset-0 bg-white/40 w-1/2 rounded-full translate-x-full"></div>
</div>
<span class="font-label-mono text-label-mono text-primary font-bold uppercase text-[10px]">Finalizing</span>
</div>
</div>
</section>

<section class="relative w-full aspect-[3/4.5] max-h-[600px] flex justify-center mt-2 perspective-1000">

<div class="absolute top-4 w-[90%] h-full bg-surface-container-low border border-white/40 rounded-[2rem] shadow-sm flex flex-col overflow-hidden opacity-60 scale-95 transform-origin-top">
<div class="w-full h-[55%] bg-surface-container-high relative"></div>
<div class="p-6 flex flex-col gap-4">
<div class="h-6 w-1/2 bg-surface-container-highest rounded animate-pulse"></div>
<div class="h-4 w-1/3 bg-surface-container-highest rounded animate-pulse"></div>
</div>
</div>
<!-- Foreground Card (Current Match) -->
<div class="absolute top-0 w-full h-full bg-surface-container-lowest border-[1.5px] border-white rounded-[2rem] shadow-2xl shadow-primary/10 flex flex-col overflow-hidden z-10 transition-transform hover:-translate-y-1">

<div class="w-full h-[55%] relative bg-surface-container-high overflow-hidden">

<div class="absolute top-4 right-4 bg-surface-container-lowest/90 backdrop-blur-md border border-white/60 shadow-sm px-3 py-1.5 rounded-full flex items-center gap-1.5">
<span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-label-mono text-label-mono text-primary font-bold">96% Match</span>
</div>
</div>
<!-- Card Details -->
<div class="flex-grow p-6 flex flex-col justify-between bg-surface-container-lowest">
<!-- Header Info -->
<div>
<div class="flex items-center gap-2 mb-1">
<h2 class="font-headline-md text-headline-md text-on-surface">Dr. Elena Rostova</h2>
<span class="material-symbols-outlined text-secondary text-[20px]" style="font-variation-settings: 'FILL' 1;" title="Verified Expert">verified</span>
</div>
<p class="font-body-base text-body-base text-on-surface-variant">Lead AI Systems Architect</p>
</div>

<span class="font-label-mono text-label-mono text-on-surface text-[11px]">2.4 mi</span>

</div>

<span class="material-symbols-outlined text-on-surface-variant text-[20px]">event_available</span>
<span class="font-label-mono text-label-mono text-on-surface text-[11px]">Today</span>
</div>
</div>

<button class="w-full bg-gradient-to-r from-primary-container to-primary text-white py-4 rounded-xl font-headline-md text-headline-md shadow-lg shadow-primary-container/30 hover:opacity-90 hover:scale-[0.98] transition-all flex items-center justify-center gap-2">

<span class="material-symbols-outlined text-[20px]">arrow_forward</span>

</div>
