<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B" />
      <stop offset="100%" style="stop-color:#A78BFA" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="60" stroke="url(#orbit-grad)" stroke-width="4" stroke-dasharray="8 4" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="100" cy="100" r="20" fill="url(#orbit-grad)" />
  <circle cx="100" cy="40" r="6" fill="#FF6B6B">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="4s" repeatCount="indefinite" />
  </circle>
  <text x="100" y="180" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="bold" font-size="24" fill="#0F1117">Orbit</text>
</svg>